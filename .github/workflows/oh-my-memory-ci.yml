name: oh-my-memory CI

on:
  push:
    paths:
      - "oh-my-memory/**"
      - ".github/workflows/oh-my-memory-ci.yml"
  pull_request:
    paths:
      - "oh-my-memory/**"
      - ".github/workflows/oh-my-memory-ci.yml"
  workflow_dispatch:

env:
  OH_MY_MEMORY_CREATE_ISSUE: "false"

jobs:
  instrumented:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: oh-my-memory
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Pre-test hook (typecheck)
        run: bun run src/cli.ts hook --config configs/ci.json --stage pre-test -- bun run typecheck

      - name: During-test hook (tests)
        run: bun run src/cli.ts hook --config configs/ci.json --stage during-test -- bun test

      - name: Post-test hook (build)
        if: always()
        run: bun run src/cli.ts hook --config configs/ci.json --stage post-test -- bun run build

      - name: Resolve latest report path
        if: always()
        id: latest_report
        run: |
          if [ -f .oh-my-memory/latest-report-path.txt ]; then
            REPORT_PATH=$(cat .oh-my-memory/latest-report-path.txt)
            REPORT_PATH=$(echo "$REPORT_PATH" | tr -d '\r\n')
            echo "path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload oh-my-memory artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oh-my-memory-artifacts
          path: oh-my-memory/.oh-my-memory
          retention-days: 14

      - name: Emit issue template from latest report
        if: failure() && steps.latest_report.outputs.path != ''
        run: bun run src/cli.ts emit-github-assets --report "${{ steps.latest_report.outputs.path }}"

      - name: Optional auto-create GitHub issue
        if: failure() && steps.latest_report.outputs.path != '' && env.OH_MY_MEMORY_CREATE_ISSUE == 'true' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run src/cli.ts emit-github-assets --report "${{ steps.latest_report.outputs.path }}" --create-issue
